services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    environment:
      - PUID=${JELLYFIN_UID}
      - PGID=${JELLYFIN_GID}
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/config
      - /storage/hdd-1/video:/media
    networks:
      - nginx_net

networks:
  nginx_net:
    external: true
