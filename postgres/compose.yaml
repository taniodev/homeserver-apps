services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - postgres:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - joplin
      - miniflux

secrets:
  postgres_password:
    file: ./.secrets/postgres_password.txt

volumes:
  postgres:

networks:
  joplin: # postgres_joplin
    driver: bridge
  miniflux: # postgres_miniflux
    driver: bridge
