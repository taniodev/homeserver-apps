services:
  navidrome:
    image: deluan/navidrome:0.58.0
    user: ${NAVIDROME_UID}:${NAVIDROME_GID}
    container_name: navidrome
    restart: unless-stopped
    environment:
      - ND_DEFAULTLANGUAGE=pt
    volumes:
      - ./data:/data
      - /storage/ssd-1/Músicas:/music:ro
    networks:
      - nginx_net

networks:
  nginx_net:
    external: true
